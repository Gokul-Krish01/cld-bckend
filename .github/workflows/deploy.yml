name: Deploy Cloudflare Worker

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - staging

jobs:
  # 1️⃣ Stage 1: Build Phase
  build:
    runs-on: ubuntu-latest
    name: Build Project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

  # 2️⃣ Stage 2: Test Phase
  test:
    needs: build
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # 3️⃣ Stage 3: Deploy to Staging (Staging branch-la push pannina mattum)
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    name: Deploy to Staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: staging

  # 4️⃣ Stage 4: Auto-Merge Staging to Main (Staging success aanathum auto-va main-ku merge aagum)
  auto-merge:
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Merge Staging to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge staging --no-ff -m "Automated merge: staging -> main"
          git push origin main

  # 5️⃣ Stage 5: Deploy to Production (Main branch-la irunthalo,illa auto-merge aanalum iredct-ah run aagum)
  deploy-production:
    needs: [test, auto-merge]
    if: always() && (github.ref == 'refs/heads/main' || needs.auto-merge.result == 'success')
    runs-on: ubuntu-latest
    name: Deploy to Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          environment: production